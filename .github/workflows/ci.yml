name: Code checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Python-Syntax prüfen
        run: python -m py_compile config.py main.py watcher.py wake_timer.py tests/test_config.py tests/test_main_logic.py tests/test_security.py

      - name: Unit-Tests ausführen
        run: python -m unittest discover -s tests -v

      - name: PowerShell-Syntax prüfen
        shell: pwsh
        run: |
          $files = @(
            "install_bot_watcher_task.ps1",
            "start_watcher_once.ps1"
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
